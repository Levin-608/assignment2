<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Daily Habit Tracker</title>
    <!-- Tailwind CSS for clean layout styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9;
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen p-4 sm:p-8">

    <!-- Container -->
    <div class="max-w-3xl mx-auto space-y-6">

        <!-- App Header -->
        <header class="bg-indigo-600 text-white rounded-2xl p-6 shadow-md flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold">Habit Tracker</h1>
                <p class="text-xs text-indigo-200 mt-1">Build daily streaks, simple & local</p>
            </div>
            <i class="fa-solid fa-fire text-amber-300 text-3xl"></i>
        </header>

        <!-- Metrics Dashboard -->
        <div class="grid grid-cols-2 gap-4">
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                <p class="text-xs text-slate-500 font-semibold uppercase">Total Habits</p>
                <h2 id="total-habits-count" class="text-3xl font-bold text-slate-800 mt-1">0</h2>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                <p class="text-xs text-slate-500 font-semibold uppercase">Completed Today</p>
                <h2 id="completed-today-count" class="text-3xl font-bold text-emerald-600 mt-1">0</h2>
            </div>
        </div>

        <!-- Create Habit Form -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h2 class="text-base font-bold text-slate-900 mb-4">Add a New Habit</h2>
            <form id="habit-form" onsubmit="addHabit(event)" class="flex flex-col sm:flex-row gap-3">
                <input 
                    type="text" 
                    id="habit-name" 
                    placeholder="e.g. Read 10 Pages" 
                    required 
                    class="flex-grow px-4 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                >
                <select 
                    id="habit-category" 
                    class="px-4 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                >
                    <option value="Study">Study 📚</option>
                    <option value="Health">Health 🏃</option>
                    <option value="Coding">Coding 💻</option>
                    <option value="Personal">Personal ✨</option>
                </select>
                <button 
                    type="submit" 
                    class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-5 py-2 rounded-lg text-sm transition"
                >
                    Add Habit
                </button>
            </form>
        </div>

        <!-- Habit List -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h2 class="text-base font-bold text-slate-900 mb-4">Your Habits</h2>
            <div id="habit-list" class="space-y-3">
                <!-- Habit items will be dynamically injected here -->
            </div>
            <div id="empty-message" class="hidden text-center text-slate-400 py-8">
                <i class="fa-regular fa-calendar-check text-4xl mb-2"></i>
                <p class="text-sm">No habits added yet. Start by creating one above!</p>
            </div>
        </div>

    </div>

    <!-- JavaScript Logic -->
    <script>
        // -------------------------------------------------------------
        // 1. DATA INITIALIZATION & LOCALSTORAGE READ
        // -------------------------------------------------------------
        // Try to load existing habits from localStorage. If empty, default to an empty array [].
        let habits = JSON.parse(localStorage.getItem('my_habits')) || [];

        // -------------------------------------------------------------
        // 2. HELPER FUNCTIONS FOR STORAGE & UI REFRESH
        // -------------------------------------------------------------
        // Function to save current state into localStorage and re-render the screen
        function saveAndRefresh() {
            localStorage.setItem('my_habits', JSON.stringify(habits));
            renderHabits();
        }

        // Get today's date in YYYY-MM-DD format (used to check daily completion)
        function getTodayString() {
            const today = new Date();
            return today.toISOString().split('T')[0];
        }

        // -------------------------------------------------------------
        // 3. CREATE OPERATION (Add Habit)
        // -------------------------------------------------------------
        function addHabit(event) {
            // Prevent page refresh when submitting the form
            event.preventDefault();

            const nameInput = document.getElementById('habit-name');
            const categoryInput = document.getElementById('habit-category');

            // Create a new habit object
            const newHabit = {
                id: Date.now(), // unique timestamp ID
                name: nameInput.value.trim(),
                category: categoryInput.value,
                streak: 0,
                lastCompletedDate: null
            };

            // Add new habit to array
            habits.push(newHabit);

            // Clear input box
            nameInput.value = '';

            // Save and refresh UI
            saveAndRefresh();
        }

        // -------------------------------------------------------------
        // 4. UPDATE OPERATION (Mark Completed / Increment Streak)
        // -------------------------------------------------------------
        function toggleComplete(id) {
            const today = getTodayString();

            // Find matching habit by ID
            habits = habits.map(habit => {
                if (habit.id === id) {
                    if (habit.lastCompletedDate === today) {
                        // Undo completion for today
                        habit.streak = Math.max(0, habit.streak - 1);
                        habit.lastCompletedDate = null;
                    } else {
                        // Mark complete for today and increase streak count
                        habit.streak += 1;
                        habit.lastCompletedDate = today;
                    }
                }
                return habit;
            });

            saveAndRefresh();
        }

        // -------------------------------------------------------------
        // 5. DELETE OPERATION (Remove Habit)
        // -------------------------------------------------------------
        function deleteHabit(id) {
            // Filter out habit matching the ID
            habits = habits.filter(habit => habit.id !== id);
            saveAndRefresh();
        }

        // -------------------------------------------------------------
        // 6. READ OPERATION (Render Habits & Update Dashboard Metrics)
        // -------------------------------------------------------------
        function renderHabits() {
            const habitList = document.getElementById('habit-list');
            const emptyMessage = document.getElementById('empty-message');
            const totalHabitsCount = document.getElementById('total-habits-count');
            const completedTodayCount = document.getElementById('completed-today-count');

            const today = getTodayString();

            // Clear previous items in DOM
            habitList.innerHTML = '';

            // Calculate Dashboard Counts
            totalHabitsCount.innerText = habits.length;
            const completedToday = habits.filter(h => h.lastCompletedDate === today).length;
            completedTodayCount.innerText = completedToday;

            // Show empty state message if no habits exist
            if (habits.length === 0) {
                emptyMessage.classList.remove('hidden');
                return;
            } else {
                emptyMessage.classList.add('hidden');
            }

            // Loop through each habit and render an HTML element for it
            habits.forEach(habit => {
                const isCompletedToday = habit.lastCompletedDate === today;

                // Category badge colors
                let categoryBg = 'bg-blue-100 text-blue-700';
                if (habit.category === 'Health') categoryBg = 'bg-emerald-100 text-emerald-700';
                if (habit.category === 'Coding') categoryBg = 'bg-purple-100 text-purple-700';
                if (habit.category === 'Personal') categoryBg = 'bg-amber-100 text-amber-700';

                const habitCard = document.createElement('div');
                habitCard.className = `p-4 rounded-lg border flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 transition ${
                    isCompletedToday ? 'bg-emerald-50/50 border-emerald-200' : 'bg-slate-50 border-slate-200'
                }`;

                habitCard.innerHTML = `
                    <div class="space-y-1">
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-slate-800">${escapeHtml(habit.name)}</span>
                            <span class="text-xs px-2 py-0.5 rounded-full font-medium ${categoryBg}">${habit.category}</span>
                        </div>
                        <div class="flex items-center gap-2 text-xs text-slate-500">
                            <i class="fa-solid fa-fire text-amber-500"></i>
                            <span>${habit.streak} day streak</span>
                        </div>
                    </div>

                    <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
                        <button 
                            onclick="toggleComplete(${habit.id})" 
                            class="px-3 py-1.5 rounded-lg text-xs font-semibold transition ${
                                isCompletedToday 
                                    ? 'bg-emerald-600 hover:bg-emerald-700 text-white' 
                                    : 'bg-white border border-slate-300 hover:bg-slate-100 text-slate-700'
                            }"
                        >
                            ${isCompletedToday ? '<i class="fa-solid fa-check mr-1"></i> Done Today' : 'Mark Completed Today'}
                        </button>
                        
                        <button 
                            onclick="deleteHabit(${habit.id})" 
                            class="text-slate-400 hover:text-rose-600 p-2 text-sm transition"
                            title="Delete Habit"
                        >
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                `;

                habitList.appendChild(habitCard);
            });
        }

        // Helper function to escape user input strings safely
        function escapeHtml(str) {
            return str.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag] || tag));
        }

        // Initial render on page load
        renderHabits();
    </script>
</body>
</html>
