
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Daily Expense Tracker</h1>
        <p>Manage your money, one day at a time.</p>
    </header>

    <main>
        <p id="message" role="status"></p>

        <!-- Login -->
        <section id="loginSection" class="panel">
            <h2>Login</h2>
            <form id="loginForm">
                <input type="email" id="loginEmail"
                       placeholder="Email" required>
                <input type="password" id="loginPassword"
                       placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
            <p>New user?
                <button id="showRegister" class="linkButton">
                    Create an account
                </button>
            </p>
        </section>

        <!-- Registration -->
        <section id="registerSection" class="panel hidden">
            <h2>Create Account</h2>
            <form id="registerForm">
                <input type="text" id="regName"
                       placeholder="Your name" required>
                <input type="email" id="regEmail"
                       placeholder="Email" required>
                <input type="password" id="regPassword"
                       placeholder="Password (8 characters minimum)"
                       minlength="8" required>
                <button type="submit">Register</button>
            </form>
            <p>Already registered?
                <button id="showLogin" class="linkButton">
                    Login
                </button>
            </p>
        </section>

        <!-- Dashboard -->
        <section id="dashboard" class="hidden">
            <div class="welcome">
                <h2>Welcome, <span id="userName"></span>!</h2>
                <button id="logoutBtn" class="secondary">
                    Logout
                </button>
            </div>

            <div class="totalCard">
                <p>Total Expenses</p>
                <h2 id="total">₹0.00</h2>
            </div>

            <section class="panel">
                <h2 id="formTitle">Add an Expense</h2>

                <form id="expenseForm">
                    <input type="hidden" id="expenseId">

                    <label for="title">Expense Name</label>
                    <input type="text" id="title"
                           placeholder="e.g. Lunch" maxlength="100" required>

                    <label for="amount">Amount (₹)</label>
                    <input type="number" id="amount"
                           min="0.01" max="99999999.99"
                           step="0.01" placeholder="100" required>

                    <label for="category">Category</label>
                    <select id="category" required>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Education">Education</option>
                        <option value="Bills">Bills</option>
                        <option value="Other">Other</option>
                    </select>

                    <label for="expenseDate">Date</label>
                    <input type="date" id="expenseDate" required>

                    <button type="submit" id="saveBtn">
                        Add Expense
                    </button>
                    <button type="button" id="cancelEdit"
                            class="secondary hidden">
                        Cancel Edit
                    </button>
                </form>
            </section>

            <section class="panel">
                <h2>My Expenses</h2>
                <div id="expenseList"></div>
            </section>
        </section>
    </main>

    <footer>
        <p>Daily Expense Tracker | Student Project</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
